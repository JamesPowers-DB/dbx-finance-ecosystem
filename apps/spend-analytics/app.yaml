# Databricks App runtime configuration.
# All env vars MUST live here. They cannot be parameterized with ${var.*}:
#   - app.yaml is synced verbatim (app source, NOT bundle config), so DAB does
#     not substitute ${var.*} here.
#   - the bundle can't set them either — resources.apps.<name>.config has no
#     env_vars field (it's an "unknown field" warning that does nothing).
# `valueFrom:` is the one dynamic option — it resolves an app *resource* binding
# (e.g. the warehouse) at runtime. `value:` are literals.
#
# ► DEPLOY KNOBS for the e2-demo-west workspace (fill before/at deploy):
#     LAKEBASE_HOST / LAKEBASE_DATABASE / LAKEBASE_ENDPOINT — the Lakebase
#       project on e2-demo-west that backs the savings register + chat history.
#     GENIE_SPACE_TITLE — must match what provision_genie creates for this target.
#     DATABRICKS_SERVING_ENDPOINT_NAME — a Claude/Llama endpoint on e2-demo-west.
#   Catalog + schema match the bundle (catalog `main`, one schema).

command:
  - "uvicorn"
  - "backend.main:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "$DATABRICKS_APP_PORT"

env:
  # Resource bindings — DAB substitutes the live warehouse ID at deploy time.
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: warehouse

  # Lakebase Autoscaling — PLACEHOLDERS for the e2-demo-west project that backs
  # app state (savings_register, chatbot_sessions/messages). The app mints a
  # short-lived OAuth credential per request against LAKEBASE_ENDPOINT.
  # ► TODO(deploy): set these to the e2-demo-west Lakebase project/endpoint.
  - name: LAKEBASE_HOST
    value: "ep-flat-term-d2wmep2h.database.us-east-1.cloud.databricks.com"
  - name: LAKEBASE_PORT
    value: "5432"
  - name: LAKEBASE_DATABASE
    value: "databricks_postgres"
  - name: LAKEBASE_ENDPOINT
    value: "projects/finance-spend-analytics/branches/production/endpoints/primary"




  # Genie space — the ask_genie tool resolves the space id by TITLE at runtime,
  # so nothing has to write an id here. Must match the title provision_genie
  # creates (genie_space_def.space_title): "<base> (<target>)". Single prod
  # target → "(prod)". Set GENIE_SPACE_ID to pin a specific id instead.
  - name: GENIE_SPACE_TITLE
    value: "Financial Spend Analytics - Strategic Sourcing"

  # FMAPI serving endpoint for the procurement chatbot.
  # ► TODO(deploy): confirm this Claude endpoint exists on e2-demo-west.
  - name: DATABRICKS_SERVING_ENDPOINT_NAME
    value: "databricks-claude-sonnet-4-6"

  # Unity Catalog coordinates. Single schema; tables are layer-prefixed
  # (gold_ / silver_ / ml_) — the app adds the prefix at the query site.
  - name: DATABRICKS_CATALOG
    value: "powers_land_catalog"
  - name: DATABRICKS_SCHEMA
    value: "finance_spend_analytics"
