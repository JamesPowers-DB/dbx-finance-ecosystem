resources:
  jobs:
    train_spend_classifier:
      name: finance-spend-analytics-train-spend-classifier-${bundle.target}
      description: >
        End-to-end training orchestration for the spend-classification model.

        DAG:
          prepare_features ──▶ train_baseline ──▶ evaluate ──▶ batch_inference

        Inputs: gold.fact_invoices (populated by the build_lakehouse pipeline).
        Outputs:
          - <catalog>.ml.{spend_clf_train, spend_clf_holdout, spend_clf_maverick_holdout}
          - <catalog>.ml.spend_classifier (UC-registered model with @challenger / @production aliases)
          - <catalog>.ml.spend_clf_eval_runs (eval history)
          - <catalog>.ml.invoice_classifications (predictions MERGEd in by invoice_line_id; gold.fact_invoices LEFT-joins through silver.invoice_classification)

        Run this after `build_lakehouse` has populated gold. See `ml/README.md`
        for the full model spec and training process.
      max_concurrent_runs: 1
      email_notifications: {}
      environments:
        - environment_key: ml_train
          spec:
            client: "2"
            dependencies:
              # NOTE: a bare `--requirement <file>` does NOT change the serverless
              # environment fingerprint when the file's CONTENTS change, so editing
              # requirements-ml.txt alone reuses a stale cached env. Pin new deps
              # directly here (changes the spec → forces an env rebuild).
              - optuna>=3.6,<5.0
              - --requirement /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/files/requirements.txt
              - --requirement /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/files/requirements-ml.txt
      tasks:
        - task_key: prepare_features
          environment_key: ml_train
          notebook_task:
            notebook_path: ../ml/spend_classification/prepare_features.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              maverick_threshold: "0.15"
              test_size: "0.20"
              random_seed: "42"

        - task_key: train_baseline
          environment_key: ml_train
          depends_on:
            - task_key: prepare_features
          notebook_task:
            notebook_path: ../ml/spend_classification/train_baseline.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              model_name: spend_classifier
              model_alias: challenger
              hpo_trials: "10"
              hpo_sample_rows: "60000"

        - task_key: evaluate
          environment_key: ml_train
          depends_on:
            - task_key: train_baseline
          notebook_task:
            notebook_path: ../ml/spend_classification/evaluate.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              model_name: spend_classifier

        - task_key: batch_inference
          environment_key: ml_train
          depends_on:
            - task_key: evaluate
          notebook_task:
            notebook_path: ../ml/spend_classification/batch_inference.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              model_name: spend_classifier
              model_alias: production

      queue:
        enabled: true
