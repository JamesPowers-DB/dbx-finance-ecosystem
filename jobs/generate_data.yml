resources:
  jobs:
    generate_data:
      name: finance-spend-analytics-generate-data-${bundle.target}
      description: >
        Synthesize source-shaped raw files into
        /Volumes/${var.catalog}/${var.schema}/${var.raw_volume}/.

        Order: macro factors → seed anchor table (hand-curated, 1/10-scaled
        from a reference industrial, anonymized) → per-source file generators
        (Ariba CSVs, Fusion CSV/Parquet) → reconciliation gate. Reconciliation
        fails the job if quarterly spend aggregates drift more than ±2% from
        the period anchors.
      max_concurrent_runs: 1
      email_notifications: {}
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - --requirement /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/files/requirements.txt
      tasks:
        - task_key: generate_macro_environment
          environment_key: default
          notebook_task:
            notebook_path: ../data/generators/00_macro_environment.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: seed_period_anchors
          environment_key: default
          depends_on:
            - task_key: generate_macro_environment
          notebook_task:
            notebook_path: ../data/generators/01_period_anchors_seed.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: generate_ariba_files
          environment_key: default
          depends_on:
            - task_key: seed_period_anchors
          notebook_task:
            notebook_path: ../data/generators/02_ariba_files.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              raw_volume: ${var.raw_volume}

        - task_key: generate_fusion_files
          environment_key: default
          depends_on:
            - task_key: seed_period_anchors
            - task_key: generate_ariba_files   # Fusion reads Ariba PRs to seed POs
          notebook_task:
            notebook_path: ../data/generators/03_fusion_files.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              raw_volume: ${var.raw_volume}

        - task_key: reconcile_tie_out
          environment_key: default
          depends_on:
            - task_key: generate_ariba_files
            - task_key: generate_fusion_files
          notebook_task:
            notebook_path: ../data/generators/99_reconcile.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              raw_volume: ${var.raw_volume}
              tolerance_pct: "2.0"

      queue:
        enabled: true
