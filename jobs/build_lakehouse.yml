resources:
  jobs:
    build_lakehouse:
      name: finance-spend-analytics-build-lakehouse-${bundle.target}
      description: >
        Run the Lakeflow pipeline that materializes bronze → silver → gold
        from files in /Volumes/${var.catalog}/raw_data/files/. Run this after
        finance-spend-analytics-generate-data has produced fresh source files.
      max_concurrent_runs: 1
      email_notifications: {}
      tasks:
        - task_key: run_lakehouse_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.lakehouse.id}
            full_refresh: false

      queue:
        enabled: true
