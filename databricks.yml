bundle:
  name: dbx-horizontal-finance-spend-analytics

include:
  - resources/*.yml
  - jobs/*.yml

variables:
  catalog:
    description: Unity Catalog name for this project
    default: powers_land_catalog

  schema:
    description: >
      Single schema holding every layer of the project. Tables are layer-prefixed
      (bronze_ / silver_ / gold_ / ml_ / meta_) so the whole medallion + ML +
      metadata + raw volume live under one schema.
    default: finance_spend_analytics

  raw_volume:
    description: Managed volume (under ${schema}) holding source-system files
    default: files

  warehouse_id:
    description: SQL warehouse ID used by the Spend Analytics app (OBO queries)
    default: 243750e48fe7f5cb

sync:
  include:
    - apps/*/frontend/dist/**
    - apps/*/frontend/dist/ds/**
  exclude:
    - apps/*/frontend/node_modules/**
    - apps/*/.venv/**
    - "**/__pycache__/**"
    - "**/*.pyc"
    - _demo/**

targets:
  # Single production target. mode: production gives deterministic resource names
  # (no dev-prefix preset). Catalog is a variable, so retargeting to another
  # workspace/catalog is a one-line override.
  # dev:
  #   mode: production
  #   default: true
  #   workspace:
  #     host: https://fevm-powers-land.cloud.databricks.com
  #     root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
  #   run_as:
  #     user_name: ${workspace.current_user.userName}

  prod:
    mode: production
    default: true
    workspace:
      host: https://fevm-powers-land.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: ${workspace.current_user.userName}
