resources:
  pipelines:
    lakehouse:
      name: finance-spend-analytics-lakehouse-${bundle.target}
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      continuous: false
      development: false
      photon: true
      libraries:
        # ---------------------------------------------------------------- spend
        # Bronze: PR (Ariba) + Sourcing (Ariba) + PO (Fusion) + AP (Fusion)
        #         + the one GL chart-of-accounts table fact_invoices needs
        - file: { path: ../pipelines/spend/bronze/ariba_purchase_requests.sql }
        - file: { path: ../pipelines/spend/bronze/ariba_sourcing.sql }
        - file: { path: ../pipelines/spend/bronze/fusion_po.sql }
        - file: { path: ../pipelines/spend/bronze/fusion_ap.sql }
        - file: { path: ../pipelines/spend/bronze/fusion_gl_code_combinations.sql }
        # Silver: PR / PO / invoice_ap (line grain) / sourcing / classification
        - file: { path: ../pipelines/spend/silver/purchase_request.sql }
        - file: { path: ../pipelines/spend/silver/purchase_order.sql }
        - file: { path: ../pipelines/spend/silver/invoice_ap.sql }
        - file: { path: ../pipelines/spend/silver/sourcing_event.sql }
        - file: { path: ../pipelines/spend/silver/invoice_classification.sql }
        # Gold: PR / PO / invoices (the ML-classified spend surface) + cost savings
        - file: { path: ../pipelines/spend/gold/fact_purchase_requests.sql }
        - file: { path: ../pipelines/spend/gold/fact_purchase_orders.sql }
        - file: { path: ../pipelines/spend/gold/fact_invoices.sql }
        - file: { path: ../pipelines/spend/gold/fact_cost_savings.sql }

        # ------------------------------------------------------- parties (master)
        # Supplier side only (customer side dropped in the lean fork).
        - file: { path: ../pipelines/parties/bronze/ariba_supplier_master.sql }
        - file: { path: ../pipelines/parties/bronze/fusion_supplier_sites.sql }
        - file: { path: ../pipelines/parties/silver/supplier.sql }
        - file: { path: ../pipelines/parties/gold/dim_supplier.sql }

        # ---------------------------------------------------------------- legal
        # Inbound contracts only (outbound + CMS dropped).
        - file: { path: ../pipelines/legal/bronze/ariba_contract_workspace.sql }
        - file: { path: ../pipelines/legal/silver/contract_inbound.sql }

        # ------------------------------------------------------------ reference
        - file: { path: ../pipelines/reference/gold/dim_segment.sql }
        - file: { path: ../pipelines/reference/gold/dim_date.sql }
        - file: { path: ../pipelines/reference/gold/dim_macro_environment.sql }
        - file: { path: ../pipelines/reference/gold/dim_spend_category.sql }

      configuration:
        # Exposed inside SQL files as ${catalog}, ${schema}, ${raw_volume}.
        catalog: ${var.catalog}
        schema: ${var.schema}
        raw_volume: ${var.raw_volume}
