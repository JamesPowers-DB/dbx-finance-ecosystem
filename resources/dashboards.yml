resources:
  dashboards:
    spend_visibility:
      display_name: "Finance Spend Analytics — Spend Visibility"
      # Serialized AI/BI (Lakeview) dashboard. Storytelling flow over the governed
      # metric views: KPIs → trend → drivers (PR source / managed-status) →
      # lifecycle funnel + highest-leverage suppliers. The primary Databricks-first
      # consumption surface for the spend-visibility outcome.
      file_path: ../dashboards/spend_visibility.lvdash.json
      warehouse_id: ${var.warehouse_id}
      parent_path: ${workspace.file_path}/dashboards
      # Single schema; metric views are gold-prefixed, so the dashboard queries
      # reference gold_mv_spend / gold_mv_supplier_performance.
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}
