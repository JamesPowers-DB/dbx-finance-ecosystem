resources:
  # NOTE: this bundle does NOT create the catalog — it deploys INTO an existing
  # one (var.catalog). On accounts with Default Storage / a metastore storage
  # root, an API-created catalog needs an explicit MANAGED LOCATION, so creating
  # it from the bundle fails; instead point var.catalog at a catalog that already
  # exists, and the schema + volume below are created inside it (inheriting its
  # storage root). To create a fresh catalog, do it once in the UI (Default
  # Storage) or with `CREATE CATALOG <name> MANAGED LOCATION '<s3-path>'`.
  schemas:
    # One schema holds every layer. Tables are layer-prefixed (bronze_ / silver_
    # / gold_ / ml_ / meta_) so the medallion + ML + metadata + raw volume all
    # live together under ${var.schema}.
    finance_spend_analytics:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: >
        Single project schema. bronze_* (source-shaped raw), silver_* (conformed
        entities), gold_* (facts/dims/metric views), ml_* (spend classifier),
        meta_* (period anchors). Source files land in the ${var.raw_volume} volume.

  volumes:
    raw_files:
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      name: ${var.raw_volume}
      volume_type: MANAGED
      comment: >
        Landing zone. Subdirectories — sap_ariba/, oracle_fusion/. Generators
        write here; bronze pipelines read from here.
